name: Format PR 115

on:
  push:
    branches:
      - docs/expand-flexbox-common-mistakes

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: docs/expand-flexbox-common-mistakes

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Format CSS docs
        run: npx prettier src/pages/css/index.md --write

      - name: Commit formatting
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/pages/css/index.md
          git commit -m "docs: format CSS answers"
          git push origin HEAD:docs/expand-flexbox-common-mistakes
