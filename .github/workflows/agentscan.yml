name: AgentScan

on:
  pull_request_target:
    types:
      - opened
      - reopened

jobs:
  agentscan:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      issues: write
      pull-requests: write

    steps:
      - name: AgentScan
        uses: MatteoGabriele/agentscan-action@c7d61446e7aece6bdd3edcee4558bbfc0392615e
        with:
          trusted-author-associations: member,owner,collaborator
