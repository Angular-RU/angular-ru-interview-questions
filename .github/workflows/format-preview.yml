name: Format preview

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Polish wording
        run: |
          python <<'PY'
          from pathlib import Path

          path = Path('src/pages/operating-systems/index.md')
          content = path.read_text()
          replacements = {
              'JavaScript страницы обычно выполняется': 'JavaScript-код страницы обычно выполняется',
              'три стандартных stream': 'три стандартных потока',
              'чтобы runtime корректно завершил pending synchronous cleanup, вместо\nнемедленного':
                  'чтобы event loop завершился естественно и buffered output успел записаться, вместо\nнемедленного',
              'физическим разьемом': 'физическим разъемом',
              'Options вроде': 'Опции вроде',
              'обращается к hierarchy DNS servers.': 'обращается к иерархии DNS-серверов.',
              'DNS только помогает найти network data.':
                  'DNS только помогает найти сетевой адрес и другие records.',
              'хотя browser window уже закрыто.': 'хотя вкладка браузера уже закрыта.',
          }

          for source, target in replacements.items():
              if source not in content:
                  raise RuntimeError(f'Missing text: {source}')
              content = content.replace(source, target)

          path.write_text(content)
          PY

      - name: Format files
        run: npm run format

      - name: Commit changes
        run: |
          if git diff --quiet; then
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add CONTRIBUTING.md package.json scripts/audit-answer-depth.mjs \
            src/pages/computer-science/index.md \
            src/pages/operating-systems/index.md
          git commit -m "docs: polish expanded answers"
          git push origin HEAD:${{ github.head_ref || github.ref_name }}
