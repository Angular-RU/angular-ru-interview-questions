name: Answer audit preview

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check formatting
        run: npm run format:check

      - name: Audit answer depth
        run: npm run audit:answers | tee answer-audit.txt

      - name: Archive audit
        uses: actions/upload-artifact@v4
        with:
          name: answer-audit
          path: answer-audit.txt
          if-no-files-found: error
