name: Format preview

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Format files
        run: npm run format

      - name: Commit formatting
        run: |
          if git diff --quiet; then
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add CONTRIBUTING.md package.json scripts/audit-answer-depth.mjs \
            src/pages/computer-science/index.md \
            src/pages/operating-systems/index.md
          git commit -m "chore: format expanded answers"
          git push origin HEAD:${{ github.head_ref || github.ref_name }}
