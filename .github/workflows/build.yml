name: Build

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Format Markdown
        run: npm run format

      - name: Validate explicit answers
        shell: bash
        run: |
          questions=$(grep -Roh '<table><tr><td>' src/pages --include='*.md' | wc -l)
          short_answers=$(grep -Roh '\*\*Короткий ответ\*\*' src/pages --include='*.md' | wc -l)
          full_answers=$(grep -Roh '\*\*Полный ответ\*\*' src/pages --include='*.md' | wc -l)
          open_details=$(grep -Roh '<details\b' src/pages --include='*.md' | wc -l)
          close_details=$(grep -Roh '</details>' src/pages --include='*.md' | wc -l)

          echo "Questions: $questions"
          echo "Short answers: $short_answers"
          echo "Full answers: $full_answers"
          echo "Details: $open_details/$close_details"

          test "$questions" -gt 0
          test "$questions" -eq "$short_answers"
          test "$questions" -eq "$full_answers"
          test "$open_details" -eq "$close_details"

      - name: Build
        run: npm run build

      - name: Remove temporary migration files
        run: |
          rm -f .github/scripts/add-short-full-answers.mjs
          rm -f .github/workflows/migrate-short-full-answers.yml
          git fetch origin main
          git show origin/main:.github/workflows/build.yml > .github/workflows/build.yml

      - name: Validate diff
        run: git diff --check

      - name: Commit migration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/pages .github/scripts .github/workflows
          git commit -m "docs: add explicit short and full answers"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
