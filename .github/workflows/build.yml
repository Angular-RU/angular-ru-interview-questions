name: Build

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Migrate code fence metadata
        run: node scripts/migrate-code-fence-meta.mjs

      - name: Format files
        run: npm run format

      - name: Upload migrated sources
        uses: actions/upload-artifact@v4
        with:
          name: migrated-content-figures
          path: |
            src/pages
            src/plugins/rehype-content-figures.ts
            src/styles/content-figures.css

      - name: Check formatting
        run: npm run format:check

      - name: Build
        run: npm run build
