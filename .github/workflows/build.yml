name: Build

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 26
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate formatted source (temporary)
        run: |
          npm run format
          node --input-type=module -e '
          import {readFileSync} from "node:fs";
          import {execFileSync} from "node:child_process";
          const paths = execFileSync("git", ["diff", "--name-only", "-z"]).toString().split("\\0").filter(Boolean);
          for (const path of paths) console.log("FORMATTED_FILE=" + JSON.stringify({path, content: readFileSync(path, "utf8")}));
          '

      - name: Check formatting
        run: npm run format:check

      - name: Build
        run: npm run build
